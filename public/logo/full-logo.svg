<svg width="320" height="64" viewBox="0 0 320 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Compound full logo: icon + wordmark -->
  
  <!-- Icon (scaled down slightly) -->
  <g transform="translate(0, 8)">
    <rect x="4" y="28" width="40" height="16" rx="2" fill="#404040" opacity="0.4"/>
    <rect x="4" y="16" width="40" height="16" rx="2" fill="#404040" opacity="0.7"/>
    <rect x="4" y="4" width="40" height="16" rx="2" fill="#404040"/>
    <line x1="8" y1="20" x2="8" y2="28" stroke="#404040" stroke-width="1.5" opacity="0.3"/>
    <line x1="40" y1="20" x2="40" y2="28" stroke="#404040" stroke-width="1.5" opacity="0.3"/>
    <line x1="8" y1="32" x2="8" y2="40" stroke="#404040" stroke-width="1.5" opacity="0.2"/>
    <line x1="40" y1="32" x2="40" y2="40" stroke="#404040" stroke-width="1.5" opacity="0.2"/>
  </g>
  
  <!-- Wordmark -->
  <text x="64" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" fill="#1a1a1a" letter-spacing="-0.02em">
    Compound
  </text>
</svg>

<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Compound icon: Three stacked layers representing knowledge compounding over time -->
  
  <!-- Bottom layer (oldest/foundation) -->
  <rect x="8" y="36" width="48" height="20" rx="2" fill="#404040" opacity="0.4"/>
  
  <!-- Middle layer (accumulated knowledge) -->
  <rect x="8" y="22" width="48" height="20" rx="2" fill="#404040" opacity="0.7"/>
  
  <!-- Top layer (current/active) -->
  <rect x="8" y="8" width="48" height="20" rx="2" fill="#404040"/>
  
  <!-- Optional: Small offset indicators showing connection between layers -->
  <line x1="12" y1="28" x2="12" y2="36" stroke="#404040" stroke-width="1.5" opacity="0.3"/>
  <line x1="52" y1="28" x2="52" y2="36" stroke="#404040" stroke-width="1.5" opacity="0.3"/>
  <line x1="12" y1="42" x2="12" y2="50" stroke="#404040" stroke-width="1.5" opacity="0.2"/>
  <line x1="52" y1="42" x2="52" y2="50" stroke="#404040" stroke-width="1.5" opacity="0.2"/>
</svg>
